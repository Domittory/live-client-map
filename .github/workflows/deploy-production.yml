name: Deploy to production

on:
  push:
    branches: [main]

jobs:
  migrate-production:
    name: Apply migrations and smoke-test production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Dry-run migrations (review log)
        run: >-
          supabase db push
          --project-ref "${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}"
          --password "${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}"
          --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Apply migrations to production
        run: >-
          supabase db push
          --project-ref "${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}"
          --password "${{ secrets.PRODUCTION_SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Post-deploy smoke
        run: ./scripts/post-deploy-smoke.sh "${{ secrets.PRODUCTION_URL }}"
