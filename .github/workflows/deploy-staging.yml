name: Deploy to staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [main]

jobs:
  validate-migrations:
    name: Dry-run migrations (PR gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Dry-run migrations against staging
        run: >-
          supabase db push
          --project-ref "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}"
          --password "${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}"
          --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  migrate-staging:
    name: Apply migrations to staging
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1

      - name: Apply migrations to staging
        run: >-
          supabase db push
          --project-ref "${{ secrets.STAGING_SUPABASE_PROJECT_REF }}"
          --password "${{ secrets.STAGING_SUPABASE_DB_PASSWORD }}"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Post-deploy smoke
        run: ./scripts/post-deploy-smoke.sh "${{ secrets.STAGING_URL }}"
