<h2>Вход в портал клиента</h2>

<p>Ссылка действует ограниченное время и может быть использована только один раз.</p>

<p>
  <a href="{{ if .RedirectTo }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}/auth/confirm{{ end }}?token_hash={{ .TokenHash }}&type=magiclink">Войти в портал</a>
