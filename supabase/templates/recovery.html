<h2>Сброс пароля</h2>

<p>Ссылка действует ограниченное время и может быть использована только один раз.</p>

<p>
  <a href="{{ if .RedirectTo }}{{ .RedirectTo }}{{ else }}{{ .SiteURL }}{{ end }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery">Задать новый пароль</a>
</p>

<p>Если вы не запрашивали сброс пароля, проигнорируйте это письмо — пароль останется прежним.</p>
